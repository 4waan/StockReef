name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Format
        run: forge fmt --check
      - name: Build with sizes
        run: forge build --sizes
      - name: Test
        run: forge test -vvv
        env:
          FOUNDRY_PROFILE: ci
      - name: Exported ABIs match the build
        run: node ../tools/abi/export.mjs --check

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned tzdata
        run: pip install -r tools/requirements.txt
      - name: Calendar and golden values are reproducible
        run: |
          python tools/calendar/gen_sessions.py --check
          python tools/golden/golden.py --check
          python tools/scenarios/run.py --check

  offchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Keeper typechecks
        working-directory: ops/keeper
        run: |
          npm ci
          npm run typecheck
      - name: App data is in sync and the app builds
        working-directory: app
        run: |
          npm ci
          npm run sync
          git diff --exit-code src/generated
          npm run build
