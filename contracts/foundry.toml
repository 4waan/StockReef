[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "solady/=lib/solady/src/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [
  { access = "read", path = "../tools" },
  { access = "read", path = "../deployments" },
  { access = "read-write", path = "../evidence" },
]
no_match_path = "test/fork/*"

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 64
fail_on_revert = false

[profile.fork]
no_match_path = "none"
match_path = "test/fork/*"

[profile.ci.fuzz]
runs = 2048

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"

[fmt]
line_length = 120
